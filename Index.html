<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黒潮プロジェクト 実習マッチング</title>
<style>
  :root{
    --bg:#ffffff;
    --panel:#F3F6F6;
    --panel-border:#DCE3E3;
    --ink:#16211F;
    --sub:#5C6B69;
    --accent:#0E6B63;
    --accent-dark:#0A4F49;
    --ok:#1F7A4D;
    --ok-bg:#E7F5EC;
    --warn:#B4700A;
    --warn-bg:#FBF0DE;
    --gray-bg:#EEF1F1;
    --danger:#B23A32;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;}
  #app{max-width:760px;margin:0 auto;padding:16px 16px 60px;}
  header{padding:8px 0 16px;border-bottom:1px solid var(--panel-border);margin-bottom:16px;}
  h1{font-size:18px;margin:0 0 8px;font-weight:700;letter-spacing:.01em;}
  .status-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .badge{display:inline-block;padding:3px 10px;border-radius:3px;font-size:12px;font-weight:600;white-space:nowrap;}
  .badge.open{background:var(--ok-bg);color:var(--ok);}
  .badge.wait{background:var(--warn-bg);color:var(--warn);}
  .badge.done{background:var(--gray-bg);color:var(--sub);}
  nav{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--panel-border);position:sticky;top:0;background:#fff;z-index:5;}
  nav button{flex:1;padding:10px 4px;border:none;background:none;font-size:13.5px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;}
  nav button.active{color:var(--accent-dark);border-bottom-color:var(--accent);font-weight:700;}
  section{display:none;}
  section.active{display:block;}
  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:4px;padding:14px 16px;margin-bottom:14px;}
  label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px;margin-top:10px;}
  label:first-child{margin-top:0;}
  select,input[type=text],input[type=date],input[type=number],textarea{width:100%;padding:8px 10px;border:1px solid var(--panel-border);border-radius:3px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);}
  textarea{min-height:80px;}
  button.btn{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:3px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:10px;}
  button.btn:hover{background:var(--accent-dark);}
  button.btn.secondary{background:none;color:var(--accent-dark);border:1px solid var(--accent);}
  button.btn.danger{background:none;color:var(--danger);border:1px solid var(--danger);}
  button.btn.small{padding:4px 10px;font-size:12px;margin:0;}
  .tablewrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px;}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--panel-border);vertical-align:top;}
  th{color:var(--sub);font-weight:600;font-size:11.5px;}
  .slotname{font-weight:600;}
  .note{color:var(--sub);font-size:11.5px;}
  .pill{display:inline-block;padding:1px 8px;border-radius:3px;font-size:11px;font-weight:600;white-space:nowrap;}
  .pill.ok{background:var(--ok-bg);color:var(--ok);}
  .pill.wait{background:var(--warn-bg);color:var(--warn);}
  .pill.open{background:var(--gray-bg);color:var(--sub);}
  h2{font-size:15.5px;margin:0 0 10px;}
  h3{font-size:13.5px;margin:18px 0 8px;color:var(--accent-dark);}
  .muted{color:var(--sub);font-size:12.5px;}
  hr{border:none;border-top:1px solid var(--panel-border);margin:16px 0;}
  .cool-badge{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:var(--gray-bg);color:var(--sub);font-size:10.5px;margin-right:3px;}
  .opt{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--panel-border);}
  .opt input{margin-top:4px;}
  .opt label{margin:0;font-size:14px;color:var(--ink);cursor:pointer;}
  .row-actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
  .catlabel{font-size:12px;font-weight:700;color:var(--accent-dark);margin:14px 0 4px;}
  details.sheet{background:var(--panel);border:1px solid var(--panel-border);border-radius:4px;padding:10px 14px;margin-bottom:14px;}
  details.sheet summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--accent-dark);list-style:none;display:flex;align-items:center;justify-content:space-between;}
  details.sheet summary::-webkit-details-marker{display:none;}
  details.sheet summary::after{content:'開く / 閉じる';font-weight:400;color:var(--sub);font-size:11.5px;}
  details.sheet img{width:100%;border-radius:3px;margin-top:10px;border:1px solid var(--panel-border);}
  .sheet-hint{font-size:11.5px;color:var(--sub);margin-top:6px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>黒潮医療人養成プロジェクト 長期滞在型実習マッチング</h1>
    <div class="status-row">
      <span id="roundBadge" class="badge wait">読み込み中…</span>
      <span class="muted" id="deadlineInfo"></span>
      <button class="btn secondary small" style="margin-left:auto;" onclick="refreshAll()">更新</button>
    </div>
  </header>

  <nav>
    <button class="tabbtn active" data-tab="input" onclick="showTab('input')">希望を入力</button>
    <button class="tabbtn" data-tab="status" onclick="showTab('status')">状況確認</button>
    <button class="tabbtn" data-tab="admin" onclick="showTab('admin')">管理者用</button>
  </nav>

  <section id="tab-input" class="active">
    <details class="sheet" open>
      <summary>元のクール表（配布資料）を見ながら選ぶ</summary>
      <img src="" data-src-placeholder="sheet" onerror="this.style.display='none'">
      <div class="sheet-hint">黄色く塗られたマスが実際の受入枠です。ピンチ操作で拡大できます。</div>
    </details>
    <div class="card">
      <label>あなた（出席番号・氏名）を選択</label>
      <select id="meStudent" onchange="onSelectMe()"><option value="">-- 選択してください --</option></select>
    </div>
    <div id="inputArea"></div>
  </section>

  <section id="tab-status">
    <details class="sheet">
      <summary>元のクール表（配布資料）を見る</summary>
      <img src="" data-src-placeholder="sheet" onerror="this.style.display='none'">
    </details>
    <div id="statusArea"></div>
  </section>

  <section id="tab-admin">
    <div id="adminArea"></div>
  </section>
</div>

let DB = { students:[], slots:[], meta:{round:'r1open', deadline1:'', deadline2:''}, choicesR1:{}, choicesR2:{}, resultsR1:null, resultsR2:null, overrides:{} };

// ---------- storage helpers ----------
async function getVal(key, shared, def){
  try{ const r = await window.storage.get(key, shared); return r ? JSON.parse(r.value) : def; }
  catch(e){ return def; }
}
async function setVal(key, shared, value){
  try{ await window.storage.set(key, JSON.stringify(value), shared); return true; }
  catch(e){ console.error(e); alert('保存に失敗しました。通信状態を確認してもう一度お試しください。'); return false; }
}
async function listKeys(prefix, shared){
  try{ const r = await window.storage.list(prefix, shared); return r ? r.keys : []; }
  catch(e){ return []; }
}

async function loadAll(){
  DB.students = await getVal('students', true, []);
  let slots = await getVal('slots', true, null);
  if(slots===null){ slots = DEFAULT_SLOTS; await setVal('slots', true, slots); }
  DB.slots = slots;
  let meta = await getVal('meta', true, null);
  if(meta===null){ meta = {round:'r1open', deadline1:'', deadline2:''}; await setVal('meta', true, meta); }
  DB.meta = meta;

  const r1keys = await listKeys('choice:r1:', true);
  const r1 = {};
  for(const k of r1keys){ const v = await getVal(k, true, null); if(v) r1[k.replace('choice:r1:','')] = v; }
  DB.choicesR1 = r1;

  const r2keys = await listKeys('choice:r2:', true);
  const r2 = {};
  for(const k of r2keys){ const v = await getVal(k, true, null); if(v) r2[k.replace('choice:r2:','')] = v; }
  DB.choicesR2 = r2;

  DB.resultsR1 = await getVal('results_r1', true, null);
  DB.resultsR2 = await getVal('results_r2', true, null);
  DB.overrides = await getVal('overrides', true, {});
}

function slotById(id){ return DB.slots.find(s=>s.id===id); }
function studentById(id){ return DB.students.find(s=>s.id===id); }
function coolBadges(cools){ return cools.map(c=>`<span class="cool-badge">${COOL_LABEL[c-1]}</span>`).join(''); }
function slotLabel(slot){
  const dur = slot.cools.length>1 ? '6週間' : '3週間';
  return `${slot.name}（${slot.cools.map(c=>COOL_LABEL[c-1]).join('〜')}・${dur}）`;
}
function finalSlotFor(id){
  if(DB.overrides[id]) return DB.overrides[id];
  if(DB.resultsR2 && DB.resultsR2.assignments[id]) return DB.resultsR2.assignments[id];
  if(DB.resultsR1 && DB.resultsR1.assignments[id]) return DB.resultsR1.assignments[id];
  return null;
}

// ---------- matching ----------
function tally(slots, choiceMap, capMap){
  const bySlot = {};
  for(const [sid, slotId] of Object.entries(choiceMap)){
    if(!bySlot[slotId]) bySlot[slotId]=[];
    bySlot[slotId].push(sid);
  }
  const confirmed = {}, contested = [], openSlots = [];
  for(const slot of slots){
    const cap = (capMap && capMap[slot.id]!=null) ? capMap[slot.id] : slot.capacity;
    if(cap<=0) continue;
    const list = bySlot[slot.id] || [];
    if(list.length===0){
      openSlots.push({slotId:slot.id, remaining:cap});
    } else if(list.length<=cap){
      list.forEach(sid=>confirmed[sid]=slot.id);
      const rem = cap - list.length;
      if(rem>0) openSlots.push({slotId:slot.id, remaining:rem});
    } else {
      contested.push({slotId:slot.id, studentIds:list});
      openSlots.push({slotId:slot.id, remaining:cap});
    }
  }
  return {confirmed, contested, openSlots};
}

async function runRound1(){
  if(!confirm('1次希望を締め切り、集計します。この操作は後からでもやり直せますが、学生への周知後に行ってください。よろしいですか？')) return;
  const choiceMap = {};
  for(const [sid, v] of Object.entries(DB.choicesR1)) choiceMap[sid] = v.slotId;
  const result = tally(DB.slots, choiceMap, null);
  const allIds = DB.students.map(s=>s.id);
  const unresolved = allIds.filter(id=>!(id in result.confirmed));
  const resultsR1 = {assignments:result.confirmed, contested:result.contested, openSlots:result.openSlots, unresolved};
  await setVal('results_r1', true, resultsR1);
  DB.resultsR1 = resultsR1;
  DB.meta.round = 'negotiating';
  await setVal('meta', true, DB.meta);
  await refreshAll();
  alert('1次集計が完了しました。「状況確認」タブで結果を確認してください。');
}

async function openRound2(){
  if(!confirm('2次希望の受付を開始します。未確定の学生のみ、残っている枠から選び直せるようになります。よろしいですか？')) return;
  DB.meta.round = 'r2open';
  await setVal('meta', true, DB.meta);
  await refreshAll();
}

async function runRound2(){
  if(!confirm('2次希望を締め切り、集計します。よろしいですか？')) return;
  const openCap = {};
  (DB.resultsR1.openSlots||[]).forEach(o=>openCap[o.slotId]=o.remaining);
  const unresolvedSet = new Set(DB.resultsR1.unresolved);
  const choiceMap2 = {};
  for(const [sid, v] of Object.entries(DB.choicesR2)){
    if(unresolvedSet.has(sid)) choiceMap2[sid] = v.slotId;
  }
  const result2 = tally(DB.slots, choiceMap2, openCap);
  const merged = {...DB.resultsR1.assignments, ...result2.confirmed};
  const stillUnresolved = DB.resultsR1.unresolved.filter(id=>!(id in result2.confirmed));
  const resultsR2 = {assignments:merged, contested:result2.contested, openSlots:result2.openSlots, unresolved:stillUnresolved};
  await setVal('results_r2', true, resultsR2);
  DB.resultsR2 = resultsR2;
  DB.meta.round = (stillUnresolved.length>0 || result2.contested.length>0) ? 'needs_manual' : 'done';
  await setVal('meta', true, DB.meta);
  await refreshAll();
  alert('2次集計が完了しました。');
}

async function saveOverride(studentId, slotId){
  DB.overrides[studentId] = slotId;
  await setVal('overrides', true, DB.overrides);
  await refreshAll();
}

async function markDone(){
  if(!confirm('全員の黒潮プロジェクト枠を確定状態にします。よろしいですか？')) return;
  DB.meta.round = 'done';
  await setVal('meta', true, DB.meta);
  await refreshAll();
}

async function resetAll(){
  if(!confirm('本当にすべてのデータ（学生名簿・枠・希望・結果）をリセットしますか？この操作は取り消せません。')) return;
  if(!confirm('もう一度確認します。本当によろしいですか？')) return;
  const keys1 = await listKeys('choice:r1:', true);
  const keys2 = await listKeys('choice:r2:', true);
  for(const k of [...keys1, ...keys2]){ try{ await window.storage.delete(k, true); }catch(e){} }
  await setVal('students', true, []);
  await setVal('slots', true, DEFAULT_SLOTS);
  await setVal('meta', true, {round:'r1open', deadline1:'', deadline2:''});
  await setVal('results_r1', true, null);
  await setVal('results_r2', true, null);
  await setVal('overrides', true, {});
  await refreshAll();
}

// ---------- UI: tabs ----------
function showTab(name){
  document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
}

function roundBadgeInfo(){
  switch(DB.meta.round){
    case 'r1open': return ['open','1次希望受付中'];
    case 'negotiating': return ['wait','1次集計済み・調整期間中'];
    case 'r2open': return ['open','2次希望受付中'];
    case 'needs_manual': return ['wait','2次集計済み・要手動調整'];
    case 'done': return ['done','確定'];
    default: return ['wait', DB.meta.round];
  }
}

function renderHeader(){
  const [cls,label] = roundBadgeInfo();
  const b = document.getElementById('roundBadge');
  b.className = 'badge '+cls;
  b.textContent = label;
  let dl = '';
  if(DB.meta.deadline1) dl += '1次締切: '+DB.meta.deadline1+'　';
  if(DB.meta.deadline2) dl += '2次締切: '+DB.meta.deadline2;
  document.getElementById('deadlineInfo').textContent = dl;
}

// ---------- UI: input tab ----------
function renderMeSelect(){
  const sel = document.getElementById('meStudent');
  const cur = sel.value;
  sel.innerHTML = '<option value="">-- 選択してください --</option>' + DB.students
    .slice().sort((a,b)=>a.track.localeCompare(b.track) || a.id.localeCompare(b.id))
    .map(s=>`<option value="${s.id}">[${s.track}] ${s.id} ${s.name}</option>`).join('');
  if(cur) sel.value = cur;
}

function onSelectMe(){ renderInputArea(); }

function renderInputArea(){
  const id = document.getElementById('meStudent').value;
  const area = document.getElementById('inputArea');
  if(!id){ area.innerHTML = ''; return; }
  const student = studentById(id);
  const round = DB.meta.round;

  if(round==='r1open'){
    const current = DB.choicesR1[id];
    const grouped = groupByCategory(DB.slots);
    area.innerHTML = `<div class="card">
      <h2>1次希望（黒潮プロジェクト実習先を1つ選んでください）</h2>
      <p class="muted">締切までに第一希望を1つ選んで提出してください。定員内であれば、原則そのまま確定します。定員を超えた場合はこの枠を選んだ人同士で調整いただき、後日の2次希望で改めて選び直します。締切までは何度でも選び直せます。</p>
      ${renderSlotOptions('r1choice', DB.slots, current)}
      <button class="btn" onclick="submitChoice('r1', '${id}')">この内容で提出する</button>
      ${current?`<p class="muted">現在の提出内容：${slotLabel(slotById(current.slotId))}</p>`:''}
    </div>
    <div class="card" id="liveTally"></div>`;
    renderLiveTallyBox();
  } else if(round==='negotiating'){
    const current = DB.choicesR1[id];
    area.innerHTML = `<div class="card">
      <h2>1次集計・調整期間中</h2>
      <p class="muted">現在、1次希望の集計結果をもとに調整期間中です。まもなく2次希望の受付が始まります。</p>
      ${current? `<p>あなたの1次希望：<strong>${slotLabel(slotById(current.slotId))}</strong></p>`:'<p class="muted">1次希望が未提出でした。</p>'}
    </div>`;
  } else if(round==='r2open'){
    if(DB.resultsR1.assignments[id]){
      area.innerHTML = `<div class="card"><h2>1次で確定済みです</h2>
        <p>黒潮プロジェクト実習先：<strong>${slotLabel(slotById(DB.resultsR1.assignments[id]))}</strong></p></div>`;
    } else {
      const openSlots = (DB.resultsR1.openSlots||[]).map(o=>slotById(o.slotId)).filter(Boolean);
      const current = DB.choicesR2[id];
      area.innerHTML = `<div class="card">
        <h2>2次希望（残っている枠から選んでください）</h2>
        <p class="muted">1次では確定しませんでした。話し合いの内容をふまえ、以下の残り枠から改めて希望を1つ選んでください。締切までは何度でも選び直せます。</p>
        ${openSlots.length? renderSlotOptions('r2choice', openSlots, current) : '<p class="muted">現在選べる空き枠がありません。管理者にご相談ください。</p>'}
        ${openSlots.length? `<button class="btn" onclick="submitChoice('r2', '${id}')">この内容で提出する</button>`:''}
        ${current?`<p class="muted">現在の提出内容：${slotLabel(slotById(current.slotId))}</p>`:''}
      </div>
      <div class="card" id="liveTally"></div>`;
      renderLiveTallyBox();
    }
  } else {
    const fs = finalSlotFor(id);
    area.innerHTML = `<div class="card"><h2>確定結果</h2>
      ${fs? `<p>あなたの黒潮プロジェクト実習先：<strong>${slotLabel(slotById(fs))}</strong></p>` : '<p class="muted">まだ割り当てが確定していません。管理者による調整をお待ちください。</p>'}
    </div>`;
  }
}

function groupByCategory(slots){
  const g = {};
  slots.forEach(s=>{ (g[s.category]=g[s.category]||[]).push(s); });
  return g;
}

function getLiveContext(){
  if(DB.meta.round==='r1open'){
    const map = {};
    for(const [sid,v] of Object.entries(DB.choicesR1)) map[sid]=v.slotId;
    return {map, capOf:(slot)=>slot.capacity, slots:DB.slots};
  } else if(DB.meta.round==='r2open' && DB.resultsR1){
    const unresolvedSet = new Set(DB.resultsR1.unresolved||[]);
    const map = {};
    for(const [sid,v] of Object.entries(DB.choicesR2)){ if(unresolvedSet.has(sid)) map[sid]=v.slotId; }
    const openCap = {};
    (DB.resultsR1.openSlots||[]).forEach(o=>openCap[o.slotId]=o.remaining);
    const openIds = new Set((DB.resultsR1.openSlots||[]).map(o=>o.slotId));
    return {map, capOf:(slot)=>openCap[slot.id]||0, slots: DB.slots.filter(s=>openIds.has(s.id))};
  }
  return null;
}

function renderLiveTallyBox(){
  const el = document.getElementById('liveTally');
  if(!el) return;
  const ctx = getLiveContext();
  if(!ctx){ el.innerHTML=''; return; }
  const meSel = document.getElementById('meStudent');
  const me = meSel ? meSel.value : '';
  const bySlot = {};
  for(const [sid, slotId] of Object.entries(ctx.map)){ (bySlot[slotId]=bySlot[slotId]||[]).push(sid); }
  const rows = ctx.slots.map(s=>{
    const list = bySlot[s.id]||[];
    const cap = ctx.capOf(s);
    const names = list.length ? list.map(sid=>{
      const st = studentById(sid);
      const label = `${st?st.name:sid}${sid===me?'（あなた）':''}`;
      return sid===me ? `<strong style="color:var(--accent-dark);">${label}</strong>` : label;
    }).join('、') : '<span class="muted">まだ誰も選んでいません</span>';
    const over = list.length>cap;
    return `<tr><td>${coolBadges(s.cools)}<span class="slotname">${s.name}</span></td><td>${list.length}/${cap}${over?' <span class="pill wait">超過</span>':''}</td><td style="font-size:12.5px;">${names}</td></tr>`;
  }).join('');
  el.innerHTML = `<h3 style="margin-top:0;">みんなの希望状況（自動更新）</h3>
    <p class="muted">締切までは提出内容を何度でも選び直せます。混み合っている枠が見えたら、空いている枠へ移動することもできます。</p>
    <div class="tablewrap"><table><tr><th>実習先</th><th>希望数/定員</th><th>希望している人</th></tr>${rows}</table></div>`;
}

function renderSlotOptions(name, slots, current){
  const grouped = groupByCategory(slots);
  let html = '';
  for(const [cat, list] of Object.entries(grouped)){
    html += `<div class="catlabel">${cat}</div>`;
    list.forEach(s=>{
      const checked = current && current.slotId===s.id ? 'checked' : '';
      html += `<div class="opt">
        <input type="radio" name="${name}" id="${name}-${s.id}" value="${s.id}" ${checked}>
        <label for="${name}-${s.id}">${coolBadges(s.cools)}<span class="slotname">${s.name}</span>（${s.cools.length>1?'6週間':'3週間'}）<br><span class="note">${s.note||''}</span></label>
      </div>`;
    });
  }
  return html;
}

async function submitChoice(round, studentId){
  const name = round==='r1' ? 'r1choice' : 'r2choice';
  const picked = document.querySelector(`input[name="${name}"]:checked`);
  if(!picked){ alert('希望する実習先を選んでください。'); return; }
  const key = `choice:${round}:${studentId}`;
  const ok = await setVal(key, true, {slotId:picked.value, ts:Date.now()});
  if(ok){ await refreshAll(); alert('提出しました。'); }
}

// ---------- UI: status tab ----------
function renderStatus(){
  const area = document.getElementById('statusArea');
  const choiceMap = DB.meta.round==='r1open' || DB.meta.round==='negotiating' ?
    Object.fromEntries(Object.entries(DB.choicesR1).map(([k,v])=>[k,v.slotId])) : {};

  let slotRows = DB.slots.map(s=>{
    let count=0, statusPill='';
    if(DB.meta.round==='r1open'){
      count = Object.values(choiceMap).filter(v=>v===s.id).length;
      statusPill = count===0?'<span class="pill open">未選択</span>' : count<=s.capacity? `<span class="pill ok">${count}/${s.capacity}</span>`:`<span class="pill wait">${count}/${s.capacity}（超過）</span>`;
    } else if(DB.resultsR1){
      const contested = DB.resultsR1.contested.find(c=>c.slotId===s.id);
      const openInfo = (DB.resultsR2||DB.resultsR1).openSlots.find(o=>o.slotId===s.id);
      const confirmedCount = Object.values((DB.resultsR2||DB.resultsR1).assignments).filter(v=>v===s.id).length;
      if(contested && !(DB.resultsR2 && DB.resultsR2.assignments && Object.values(DB.resultsR2.assignments).some(v=>v===s.id))){
        statusPill = `<span class="pill wait">調整中（希望${contested.studentIds.length}名/定員${s.capacity}）</span>`;
      } else if(confirmedCount>0 && openInfo){
        statusPill = `<span class="pill ok">確定${confirmedCount}・残${openInfo.remaining}</span>`;
      } else if(confirmedCount>0){
        statusPill = `<span class="pill ok">確定${confirmedCount}/${s.capacity}</span>`;
      } else if(openInfo){
        statusPill = `<span class="pill open">空き${openInfo.remaining}</span>`;
      } else {
        statusPill = `<span class="pill open">-</span>`;
      }
    }
    return `<tr><td>${coolBadges(s.cools)}<span class="slotname">${s.name}</span><br><span class="note">${s.note||''}</span></td><td>${s.category}</td><td>${s.capacity}</td><td>${statusPill}</td></tr>`;
  }).join('');

  let assignRows = '';
  const finalMap = {};
  DB.students.forEach(st=>{ const fs = finalSlotFor(st.id); if(fs) finalMap[st.id]=fs; });
  if(Object.keys(finalMap).length){
    assignRows = Object.entries(finalMap).map(([sid,slotId])=>{
      const st = studentById(sid); const s = slotById(slotId);
      return `<tr><td>[${st?st.track:''}] ${sid} ${st?st.name:''}</td><td>${s?slotLabel(s):slotId}</td></tr>`;
    }).join('');
  }

  let unresolvedList = '';
  const activeResults = DB.resultsR2 || DB.resultsR1;
  if(activeResults && activeResults.unresolved && activeResults.unresolved.length){
    unresolvedList = activeResults.unresolved.filter(id=>!DB.overrides[id]).map(id=>{
      const st = studentById(id);
      return `<li>[${st?st.track:''}] ${id} ${st?st.name:''}</li>`;
    }).join('');
  }

  area.innerHTML = `
    <div class="card">
      <h2>実習枠の状況</h2>
      <div class="tablewrap"><table><tr><th>実習先</th><th>区分</th><th>定員</th><th>状況</th></tr>${slotRows}</table></div>
    </div>
    ${Object.keys(finalMap).length? `<div class="card"><h2>確定・割当済み一覧</h2><div class="tablewrap"><table><tr><th>学生</th><th>実習先</th></tr>${assignRows}</table></div></div>`:''}
    ${unresolvedList? `<div class="card"><h2>未確定の学生</h2><ul>${unresolvedList}</ul></div>`:''}
  `;
}

    <div class="card">

function renderManualOverridePanel(){
  const activeResults = DB.resultsR2 || DB.resultsR1;
  if(!activeResults) return '';
  const unresolved = (activeResults.unresolved||[]).filter(id=>!DB.overrides[id]);
  if(!unresolved.length && !Object.keys(DB.overrides).length) return '';
  const studentOptions = unresolved.map(id=>{const st=studentById(id); return `<option value="${id}">[${st?st.track:''}] ${id} ${st?st.name:''}</option>`;}).join('');
  const slotOptions = DB.slots.map(s=>`<option value="${s.id}">${slotLabel(s)}</option>`).join('');
  const overrideRows = Object.entries(DB.overrides).map(([sid,slotId])=>{
    const st=studentById(sid); const s=slotById(slotId);
    return `<tr><td>[${st?st.track:''}] ${sid} ${st?st.name:''}</td><td>${s?slotLabel(s):slotId}</td><td><button class="btn danger small" onclick="clearOverride('${sid}')">取消</button></td></tr>`;
  }).join('');
  return `<div class="card">
    <h2>手動での割当調整</h2>
    <p class="muted">自動集計で決まらなかった学生を、管理者が直接割り当てます。</p>
    ${unresolved.length?`<select id="manualStudent">${studentOptions}</select>
    <select id="manualSlot">${slotOptions}</select>
    <button class="btn secondary" onclick="submitManual()">この内容で割り当てる</button>`:'<p class="muted">未確定の学生はいません。</p>'}
    ${overrideRows?`<hr><div class="tablewrap"><table><tr><th>学生</th><th>手動で割り当てた実習先</th><th></th></tr>${overrideRows}</table></div>`:''}
  </div>`;
}

async function submitManual(){
  const sid = document.getElementById('manualStudent').value;
  const slotId = document.getElementById('manualSlot').value;
  if(!sid || !slotId) return;
  await saveOverride(sid, slotId);
}
async function clearOverride(sid){
  delete DB.overrides[sid];
  await setVal('overrides', true, DB.overrides);
  await refreshAll();
}

async function addStudent(){
  const track = document.getElementById('newTrack').value;
  const id = document.getElementById('newId').value.trim();
  const name = document.getElementById('newName').value.trim();
  if(!id || !name){ alert('出席番号と氏名を入力してください。'); return; }
  if(DB.students.some(s=>s.id===id)){ alert('その出席番号はすでに登録されています。'); return; }
  DB.students.push({id, name, track});
  await setVal('students', true, DB.students);
  await refreshAll();
}
async function bulkAddStudents(){
  const text = document.getElementById('bulkStudents').value;
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  let added = 0;
  for(const line of lines){
    const parts = line.split(',').map(p=>p.trim());
    if(parts.length<3) continue;
    const [track, id, name] = parts;
    if(DB.students.some(s=>s.id===id)) continue;
    DB.students.push({id, name, track});
    added++;
  }
  await setVal('students', true, DB.students);
  await refreshAll();
  alert(`${added}名を登録しました。`);
}
async function deleteStudent(id){
  if(!confirm('この学生を削除しますか？')) return;
  DB.students = DB.students.filter(s=>s.id!==id);
  await setVal('students', true, DB.students);
  await refreshAll();
}

async function addSlot(){
  const name = document.getElementById('newSlotName').value.trim();
  const category = document.getElementById('newSlotCat').value;
  const coolsRaw = document.getElementById('newSlotCools').value.trim();
  const cap = parseInt(document.getElementById('newSlotCap').value,10) || 1;
  const note = document.getElementById('newSlotNote').value.trim();
  if(!name || !coolsRaw){ alert('実習先名とクールを入力してください。'); return; }
  const cools = coolsRaw.split(',').map(c=>parseInt(c.trim(),10)).filter(c=>c>=1&&c<=6);
  if(!cools.length){ alert('クールは1〜6の数字で入力してください。'); return; }
  const id = name+'-'+cools.join('')+'-'+Date.now();
  DB.slots.push({id, name, category, cools, capacity:cap, note});
  await setVal('slots', true, DB.slots);
  await refreshAll();
}
async function deleteSlot(id){
  if(!confirm('この枠を削除しますか？')) return;
  DB.slots = DB.slots.filter(s=>s.id!==id);
  await setVal('slots', true, DB.slots);
  await refreshAll();
}
async function editSlot(id){
  const s = slotById(id);
  const name = prompt('実習先名', s.name); if(name===null) return;
  const coolsRaw = prompt('クール（例: 1 または 1,2）', s.cools.join(',')); if(coolsRaw===null) return;
  const cap = prompt('定員', s.capacity); if(cap===null) return;
  const note = prompt('備考', s.note||''); if(note===null) return;
  s.name = name;
  s.cools = coolsRaw.split(',').map(c=>parseInt(c.trim(),10)).filter(c=>c>=1&&c<=6);
  s.capacity = parseInt(cap,10) || 1;
  s.note = note;
  await setVal('slots', true, DB.slots);
  await refreshAll();
}

async function saveDeadlines(){
  const d1 = document.getElementById('deadline1date').value;
  const t1 = document.getElementById('deadline1time').value || '17:00';
  const d2 = document.getElementById('deadline2date').value;
  const t2 = document.getElementById('deadline2time').value || '17:00';
  DB.meta.deadline1 = d1 ? `${d1} ${t1}` : '';
  DB.meta.deadline2 = d2 ? `${d2} ${t2}` : '';
  await setVal('meta', true, DB.meta);
  await refreshAll();
}

// ---------- main ----------
async function refreshAll(){
  await loadAll();
  renderHeader();
  renderMeSelect();
  renderInputArea();
  renderStatus();
  renderAdmin();
}

document.querySelectorAll('img[data-src-placeholder="sheet"]').forEach(img=>{ img.src = SHEET_IMG; });
refreshAll();

// Auto-refresh the live tally / status / header every 20s during open rounds,
// without re-rendering the choice form (so it doesn't reset what the user is picking).
setInterval(async ()=>{
  if(document.hidden) return;
  await loadAll();
  renderHeader();
  renderLiveTallyBox();
  renderStatus();
}, 20000);
</script>
